<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>TravelYaraa Admin - Super Admin Dashboard</title>
  <link rel="stylesheet" href="assets/admin.css">
  <script src="assets/admin-api-config.js"></script>
</head>
<body data-admin-page="dashboard">
  <div id="sideOverlay" class="ty-side-overlay" aria-hidden="true"></div>
  <aside id="sideBar" class="ty-side" aria-label="Admin navigation">
    <div class="ty-side-inner">
      <div class="ty-side-top">
        <button id="menuCloseBtn" class="ty-side-close" type="button" aria-label="Close menu">×</button>
        <div class="ty-side-brand"><img src="../travelyaraa-logo-transparent.png" alt="TravelYaraa"><div><strong>TravelYaraa</strong><span>Admin Panel</span></div></div>
        <div id="adminProfileCard" class="ty-admin-profile"><strong id="adminName">Admin</strong><span id="adminRole">Role will load after backend connection</span><span id="adminEmail">Email will load after backend connection</span></div>
        <nav id="sideNav" class="ty-nav"><a class="active" href="#">Loading...</a></nav>
      </div>
      <div class="ty-side-bottom"><button id="logoutBtn" class="ty-logout" type="button">Logout</button></div>
    </div>
  </aside>
  <main class="ty-main">
    <header class="ty-topbar"><button id="menuBtn" class="ty-menu-btn" type="button" aria-label="Open menu">☰</button><div class="ty-title-wrap"><h1 id="pageTitle">Super Admin Dashboard</h1><p>Role-based TravelYaraa admin dashboard</p></div></header>
    <section id="pageContent" class="ty-page"><div class="ty-card"><h2>Loading Super Admin Dashboard...</h2><p>Please wait while admin data loads.</p></div></section>
  </main>
  <div class="ty-drawer" id="bookingDrawer"></div>
  <script src="assets/admin.js"></script>
</body>
</html>
