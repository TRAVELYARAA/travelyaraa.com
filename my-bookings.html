<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="robots" content="noindex,nofollow">
  <title>My Bookings - TravelYaraa</title>
  <link rel="icon" href="/images/favicon.png">
  <style>
    :root{--navy:#071d49;--blue:#0062e3;--orange:#eb814b;--bg:#f4f8fd;--card:#fff;--line:#dbe7f4;--muted:#64748b;--text:#172033;--green:#087a47;--green-bg:#eaf8f1;--red:#c53529;--red-bg:#fff0ef;--amber:#9a5b00;--amber-bg:#fff6e8;--grey:#526174;--grey-bg:#eef2f6}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;max-width:100%;overflow-x:hidden}
    body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
    button,a{font:inherit}
    button{cursor:pointer}
    .page{max-width:980px;min-height:100vh;margin:0 auto;background:var(--bg)}
    .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;min-height:68px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line)}
    .back{position:relative;flex:0 0 42px;width:42px;height:42px;border:0;border-radius:13px;background:#f5f9ff;color:var(--blue);font-size:0}
    .back:before{content:"";position:absolute;left:16px;top:13px;width:13px;height:13px;border-left:3px solid currentColor;border-bottom:3px solid currentColor;transform:rotate(45deg)}
    .topbar h1{margin:0;color:var(--navy);font-size:25px;line-height:1.1;font-weight:900}
    .service-tabs,.status-tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:12px 14px 4px}
    .service-tabs::-webkit-scrollbar,.status-tabs::-webkit-scrollbar{display:none}
    .service-tab{flex:1 0 112px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--navy);padding:11px 12px;font-weight:850;box-shadow:0 5px 18px rgba(7,29,73,.04)}
    .service-tab.active{background:var(--blue);border-color:var(--blue);color:#fff}
    .status-tabs{padding-top:9px;padding-bottom:10px}
    .status-tab{flex:0 0 auto;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--muted);padding:9px 6px 8px;font-size:15px;font-weight:850;white-space:nowrap}
    .status-tab.active{color:var(--blue);border-color:var(--blue)}
    .content{padding:2px 14px 32px}
    .list{display:grid;gap:14px}
    .booking-card{overflow:hidden;border:1px solid var(--line);border-radius:19px;background:#fff;box-shadow:0 10px 28px rgba(7,29,73,.07)}
    .status-strip{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 14px;font-size:13px;font-weight:900}
    .status-strip.confirmed,.status-strip.completed{color:var(--green);background:var(--green-bg)}
    .status-strip.pending{color:var(--amber);background:var(--amber-bg)}
    .status-strip.failed,.status-strip.payment_failed{color:var(--red);background:var(--red-bg)}
    .status-strip.cancelled,.status-strip.refunded{color:var(--grey);background:var(--grey-bg)}
    .card-body{padding:15px}
    .card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
    .route{margin:0;color:var(--navy);font-size:20px;line-height:1.25;font-weight:950}
    .meta{margin:6px 0 0;color:var(--muted);font-size:12px;line-height:1.45;font-weight:700}
    .booking-id{display:flex;align-items:center;gap:7px;margin:10px 0 0;color:#526174;font-size:12px;font-weight:750}
    .booking-id b{color:var(--navy)}
    .copy{position:relative;width:28px;height:28px;border:0;border-radius:8px;background:#eef5ff;font-size:0}
    .copy:before,.copy:after{content:"";position:absolute;width:9px;height:11px;border:1.8px solid var(--blue);border-radius:2px;background:#fff}
    .copy:before{left:8px;top:7px}.copy:after{left:11px;top:10px;background:#eef5ff}
    .copy.copied:after{content:"✓";display:grid;place-items:center;width:18px;height:18px;left:5px;top:5px;border:0;background:var(--green);color:#fff;font-size:12px;font-weight:900;border-radius:50%}
    .copy.copied:before{display:none}
    .flight-summary{margin-top:14px;padding:13px;border:1px solid #e3edf8;border-radius:15px;background:#fbfdff}
    .airline{display:flex;align-items:center;gap:10px;margin-bottom:13px}
    .airline-logo{display:grid;place-items:center;flex:0 0 42px;width:42px;height:42px;border:1px solid var(--line);border-radius:11px;background:#fff;overflow:hidden;color:var(--navy);font-size:13px;font-weight:950}
    .airline-logo img{width:34px;height:34px;object-fit:contain}
    .airline b{display:block;color:var(--navy);font-size:14px}.airline span{display:block;margin-top:3px;color:var(--muted);font-size:11px;font-weight:750}
    .flight-route{display:grid;grid-template-columns:minmax(0,1fr) minmax(95px,.75fr) minmax(0,1fr);gap:9px;align-items:start}
    .point strong{display:block;color:var(--navy);font-size:19px}.point b{display:block;margin-top:3px;color:var(--navy);font-size:12px;line-height:1.35}.point small{display:block;margin-top:3px;color:var(--muted);font-size:10px;line-height:1.35}.point.right{text-align:right}
    .journey{text-align:center;padding-top:7px;color:var(--muted);font-size:10px;font-weight:800}.journey-line{position:relative;height:1px;margin:5px 0 7px;background:#a9bed8}.journey-line:before,.journey-line:after{content:"";position:absolute;top:-3px;width:7px;height:7px;border:1.5px solid var(--blue);border-radius:50%;background:#fff}.journey-line:before{left:0}.journey-line:after{right:0}.journey-line i{position:absolute;left:50%;top:-8px;transform:translateX(-50%) rotate(90deg);color:var(--blue);font-style:normal;font-size:15px}
    .hotel-summary{margin-top:8px;padding:8px;border:1px solid #e3edf8;border-radius:12px;background:#fbfdff;display:grid;grid-template-columns:56px minmax(0,1fr);gap:8px;align-items:start}
    .hotel-summary b{display:block;color:var(--navy);font-size:14px;line-height:1.25}
    .hotel-summary span{display:block;margin-top:2px;color:var(--muted);font-size:12px;font-weight:700}
    .hotel-thumb{width:56px;height:56px;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,#e8f1ff,#f7fbff);display:grid;place-items:center}
    .hotel-thumb img{width:100%;height:100%;object-fit:cover}
    .hotel-thumb.fallback:before{content:"";display:block;width:18px;height:18px;border-radius:6px;background:rgba(0,98,227,.12)}
    .hotel-summary.plain{display:block}
    .hotel-summary.plain b{display:block}
    .hotel-inline,.hotel-dates{margin-top:4px;color:var(--muted);font-size:12px;font-weight:750;line-height:1.35}
    .card-actions{display:grid;gap:8px;margin-top:10px}
    .card-actions .manage{margin-top:0}
    .card-actions .btn-secondary{display:block;width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--navy);padding:11px 14px;text-align:center;text-decoration:none;font-weight:850;cursor:pointer}
    .card-actions .btn-primary-soft{display:block;width:100%;border:0;border-radius:12px;background:var(--blue);color:#fff;padding:12px 14px;text-align:center;text-decoration:none;font-weight:900;cursor:pointer;box-shadow:0 7px 16px rgba(0,98,227,.16)}
    .status-badge{flex:0 0 auto;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:900;white-space:nowrap}
    .status-badge.confirmed,.status-badge.completed{background:var(--green-bg);color:var(--green)}
    .status-badge.pending{background:var(--amber-bg);color:var(--amber)}
    .status-badge.failed,.status-badge.payment_failed{background:var(--red-bg);color:var(--red)}
    .status-badge.cancelled,.status-badge.refunded{background:var(--grey-bg);color:var(--grey)}
    .price-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px;color:var(--muted);font-size:12px;font-weight:750}.price-row strong{color:var(--navy);font-size:15px}
    .pay-status{margin:4px 0 0;color:var(--muted);font-size:11px;font-weight:750}
    .manage{display:block;width:100%;margin-top:14px;border:0;border-radius:12px;background:var(--blue);color:#fff;padding:13px 16px;text-align:center;text-decoration:none;font-weight:900;box-shadow:0 7px 16px rgba(0,98,227,.18)}
    .manage:active{transform:translateY(1px)}
    @media(max-width:620px){.hotel-summary{grid-template-columns:52px minmax(0,1fr)}.hotel-thumb{width:52px;height:52px}}
    .state{display:grid;place-items:center;min-height:260px;padding:30px 22px;border:1px solid var(--line);border-radius:19px;background:#fff;text-align:center;box-shadow:0 9px 25px rgba(7,29,73,.05)}
    .state h2{margin:0;color:var(--navy);font-size:20px}.state p{max-width:480px;margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.55;font-weight:650}.state a,.retry{display:inline-block;margin-top:15px;border:0;border-radius:11px;background:var(--blue);color:#fff;padding:11px 18px;text-decoration:none;font-weight:900}
    .loader{width:46px;height:46px;border:4px solid #dce8f7;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .opening{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:rgba(7,29,73,.62);backdrop-filter:blur(2px)}
    .opening[hidden]{display:none}
    @media(max-width:620px){.topbar h1{font-size:22px}.service-tabs{padding-left:10px;padding-right:10px}.service-tab{flex-basis:98px}.content{padding-left:10px;padding-right:10px}.card-body{padding:13px}.route{font-size:18px}.flight-route{grid-template-columns:minmax(0,1fr) 86px minmax(0,1fr)}.point strong{font-size:17px}}
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <button class="back" id="backButton" type="button" aria-label="Go back"></button>
      <h1>All bookings</h1>
    </header>

    <nav class="service-tabs" aria-label="Booking services">
      <button class="service-tab active" type="button" data-service="flight">Flights</button>
      <button class="service-tab" type="button" data-service="hotel">Hotels</button>
      <button class="service-tab" type="button" data-service="cab">Cabs</button>
    </nav>

    <nav class="status-tabs" aria-label="Booking status">
      <button class="status-tab active" type="button" data-status="upcoming">Upcoming</button>
      <button class="status-tab" type="button" data-status="cancelled">Cancelled</button>
      <button class="status-tab" type="button" data-status="completed">Completed</button>
      <button class="status-tab" type="button" data-status="unsuccessful">Unsuccessful</button>
    </nav>

    <section class="content" id="content" aria-live="polite"></section>
  </main>
  <div class="opening" id="opening" hidden><div class="loader" aria-label="Opening booking"></div></div>

<script type="module" src="/assets/js/firebase-auth.js?v=20260803b"></script>
<script>
(function(){
  'use strict';
  const API_BASE=String(window.TRAVELYARAA_API_BASE||window.TY_API_BASE||'https://api.travelyaraa.com').replace(/\/+$/,'');
  const TOKEN_KEY='ty_user_auth_token';
  const LOGIN_FLOW_KEY='ty_mybooking_login_flow';
  const LOGIN_ACTION_KEY='ty_mybooking_login_user_action';
  const LOGIN_REDIRECT_KEY='ty_login_redirect';
  let activeService='flight';
  let activeStatus='upcoming';
  let firebaseResolved=false;
  let firebaseUser=null;
  let resolveFirebaseReady;
  const firebaseReady=new Promise(resolve=>{resolveFirebaseReady=resolve;});

  const $=(s,p=document)=>p.querySelector(s);
  const $$=(s,p=document)=>Array.from(p.querySelectorAll(s));
  const text=v=>String(v===undefined||v===null?'':v).replace(/\s+/g,' ').trim();
  const esc=v=>text(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const attr=esc;
  const arr=v=>!v?[]:(Array.isArray(v)?v:[v]);
  function token(){try{return text(localStorage.getItem(TOKEN_KEY));}catch(_){return '';}}
  function getPath(obj,path){let value=obj;for(const key of path){if(value===undefined||value===null)return undefined;value=value[key];}return value;}
  function firstValue(){for(const v of arguments){if(v===undefined||v===null||typeof v==='object')continue;const s=text(v);if(s)return s;}return '';}
  function deepFind(obj,names){const wanted=new Set(names.map(x=>String(x).toLowerCase()));const seen=new Set();function walk(v){if(!v||typeof v!=='object'||seen.has(v))return '';seen.add(v);for(const key of Object.keys(v)){const value=v[key];if(wanted.has(key.toLowerCase())&&value!==undefined&&value!==null&&typeof value!=='object'&&text(value))return value;}for(const key of Object.keys(v)){const found=walk(v[key]);if(text(found))return found;}return '';}return walk(obj);}
  function deepArray(obj,names){const wanted=new Set(names.map(x=>String(x).toLowerCase()));const seen=new Set();function walk(v){if(!v||typeof v!=='object'||seen.has(v))return [];seen.add(v);for(const key of Object.keys(v)){if(wanted.has(key.toLowerCase())&&Array.isArray(v[key])&&v[key].length)return v[key];}for(const key of Object.keys(v)){const found=walk(v[key]);if(found.length)return found;}return [];}return walk(obj);}
  function api(path){return API_BASE+(String(path).startsWith('/')?path:'/'+path);}
  function clearStoredToken(){try{localStorage.removeItem(TOKEN_KEY);localStorage.removeItem('ty_user_profile');localStorage.removeItem('travelYaraaUser');localStorage.removeItem('tyUserLoggedIn');}catch(_){}}
  function rememberLoginRedirect(){
    try{
      localStorage.setItem(LOGIN_REDIRECT_KEY,'/my-bookings.html');
      sessionStorage.setItem(LOGIN_FLOW_KEY,'1');
      sessionStorage.setItem(LOGIN_ACTION_KEY,'1');
    }catch(_){}
  }
  async function syncFirebaseUser(user){
    if(!user||typeof window.tySyncFirebaseUserWithBackend!=='function')return '';
    const result=await window.tySyncFirebaseUserWithBackend(user,{service:'account'});
    return result&&result.authToken||'';
  }
  async function ensureToken(){
    if(!firebaseResolved){
      await Promise.race([firebaseReady,new Promise(resolve=>setTimeout(resolve,2500))]);
    }
    if(!firebaseUser)return '';
    const existing=token();
    return existing||syncFirebaseUser(firebaseUser);
  }
  async function request(path){const auth=token();if(!auth){const error=new Error('AUTH_REQUIRED');error.status=401;throw error;}const response=await fetch(api(path),{method:'GET',headers:{Accept:'application/json',Authorization:'Bearer '+auth},cache:'no-store'});const data=await response.json().catch(()=>({}));if(!response.ok||data.success===false){const error=new Error(data.message||data.error||('Request failed '+response.status));error.status=response.status;throw error;}return data;}
  function rowsFrom(data){
    let rows=[];
    if(Array.isArray(data)) rows=data;
    else for(const value of [data&&data.bookings,data&&data.items,data&&data.rows,data&&data.data&&data.data.bookings,data&&data.data&&data.data.items,data&&data.data]){if(Array.isArray(value)){rows=value;break;}}
    const unique=new Map();
    rows.forEach((booking,index)=>{
      const key=String(firstValue(booking&&booking.bookingId,booking&&booking.id,booking&&booking.razorpayOrderId,booking&&booking.razorpay_order_id)||('row-'+index)).trim();
      if(!unique.has(key)) unique.set(key,booking);
    });
    return [...unique.values()];
  }

  function isRealRef(v){const s=text(v);if(!s||s.length<3)return false;if(/^(NA|N\/A|NONE|NULL|PENDING|FAILED|0)$/i.test(s))return false;return /[A-Z0-9]/i.test(s);}
  function hotelConfirmationRef(b){return firstValue(b.hotelConfirmationNumber,b.hotelConfirmationNo,b.hotelReference,b.confirmationNumber,b.confirmationNo,b.voucherNumber,getPath(b,['details','hotelConfirmationNumber']),getPath(b,['details','hotelReference']),getPath(b,['details','confirmationNumber']),getPath(b,['details','voucherNumber']));}
  function travelYaraaBookingId(b){const id=firstValue(b.bookingId,b.travelYaraaBookingId,b.id);if(/^TY/i.test(id))return id;return firstValue(b.bookingId,b.travelYaraaBookingId)||id;}
  function paymentPaid(b){const p=text(b.paymentStatus||getPath(b,['payment','status'])||'').toUpperCase();return /SUCCESS|PAID|CAPTURED|COMPLETE/.test(p);}
  function paymentFailed(b){const p=text(b.paymentStatus||b.bookingStatus||getPath(b,['payment','status'])||'').toUpperCase();return /PAYMENT_FAILED|ORDER_CREATION_FAILED/.test(p)||(/FAIL|ABORT|DECLIN/.test(p)&&!paymentPaid(b));}
  function nightsBetween(ci,co){try{const a=new Date(ci),b=new Date(co);if(Number.isNaN(a.getTime())||Number.isNaN(b.getTime()))return 0;const n=Math.round((b-a)/86400000);return n>0?n:0;}catch(_){return 0;}}
  function hotelStayPast(b,h){const out=h&&h.checkOut;if(!out)return false;try{const d=new Date(/^\d{4}-\d{2}-\d{2}$/.test(out)?out+'T23:59:59':out);if(Number.isNaN(d.getTime()))return false;return d.getTime()<Date.now();}catch(_){return false;}}
  function hotelPendingStale(b,ms){const t=Date.parse(b.updatedAt||b.createdAt||'')||0;if(!t)return true;return (Date.now()-t)>(ms||30*60*1000);}
  function statusKind(b){
    const service=text(b.service||b.type||activeService).toLowerCase();
    const bookingWords=[b.bookingStatus,b.status,b.orderStatus,b.ticketStatus].filter(Boolean).map(v=>text(v).toUpperCase()).join(' ');
    const payWords=[b.paymentStatus,getPath(b,['payment','status'])].filter(Boolean).map(v=>text(v).toUpperCase()).join(' ');
    const words=bookingWords+' '+payWords;
    if(/REFUNDED|REFUND_PROCESSED|REFUND_COMPLETED/.test(words))return 'refunded';
    if(/CANCELLED|CANCELED|VOID|CANCEL_REQUESTED/.test(bookingWords))return 'cancelled';
    if(service==='hotel'){
      // Payment authoritative first: unpaid/failed/abandoned never stay in Upcoming as Pending.
      if(!paymentPaid(b))return 'payment_failed';
      if(/PAYMENT_FAILED|ORDER_CREATION_FAILED/.test(payWords))return 'payment_failed';
      if(/PAYMENT_FAILED|BOOKING_FAILED|FAILED|FAILURE|ERROR|ABORT|UNSUCCESS|REFUND_REQUIRED|SUPPLIER_BOOKING_FAILED/.test(bookingWords))return 'failed';
      const href=hotelConfirmationRef(b);
      if(/CONFIRMED|BOOKED|COMPLETED|SUCCESS/.test(bookingWords)||isRealRef(href)){
        const h=hotelData(b);
        if(hotelStayPast(b,h)||activeStatus==='completed')return 'completed';
        return 'confirmed';
      }
      // Paid but still waiting for hotel confirmation — only briefly Pending.
      if(hotelPendingStale(b))return 'failed';
      return 'pending';
    }
    if(/PAYMENT_FAILED|BOOKING_FAILED|TICKET_FAILED|FAILED|FAILURE|ERROR|REJECT|ABORT|UNSUCCESS|REFUND_REQUIRED/.test(words))return 'failed';
    const ref=firstValue(b.airlinePnr,b.airlinePNR,b.pnr,b.airlineReference,b.ticketNumber,b.ticketNo,deepFind(b,['airlinePnr','airlinePNR','gdsPnr','pnr','airlineReference','ticketNumber','ticketNo','tktNo']));
    if(/CONFIRMED|TICKETED|BOOKED|COMPLETED|SUCCESS/.test(words)&&ref&&ref.length>=3)return 'confirmed';
    return 'pending';
  }
  function statusLabel(kind,service){
    if(service==='hotel'){
      return {confirmed:'Confirmed',completed:'Completed',pending:'Pending',failed:'Booking Failed',payment_failed:'Payment Failed',cancelled:'Cancelled',refunded:'Refunded'}[kind]||'Pending';
    }
    return {confirmed:'Confirmed',completed:'Completed',pending:'Pending',failed:'Failed',cancelled:'Cancelled',refunded:'Refunded'}[kind]||'Pending';
  }
  function paymentStatusLabel(b){
    if(paymentPaid(b))return 'Paid';
    if(paymentFailed(b))return 'Not completed';
    const p=text(b.paymentStatus||'').toUpperCase();
    if(/REFUND/.test(p))return 'Refunded';
    if(/PENDING|CREATED|INIT/.test(p))return 'Pending';
    return paymentPaid(b)?'Paid':'Pending';
  }
  function dateValue(value){if(!value)return null;const d=new Date(value);return Number.isNaN(d.getTime())?null:d;}
  function formatDate(value){const d=dateValue(value);return d?d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'';}
  function formatTime(value){const d=dateValue(value);return d?d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:false}):text(value).slice(0,5);}
  function money(value,currency){const n=Number(value);if(!Number.isFinite(n)||n<=0)return '';try{return new Intl.NumberFormat('en-IN',{style:'currency',currency:text(currency)||'INR',maximumFractionDigits:0}).format(n);}catch(_){return '₹'+Math.round(n).toLocaleString('en-IN');}}
  function duration(minutes){const n=Number(minutes);if(!Number.isFinite(n)||n<=0)return '';return Math.floor(n/60)+'h '+(n%60?String(n%60)+'m':'');}

  function flightData(b){const selected=b.selectedFlight||arr(b.selectedFlights)[0]||b.selectedResult||getPath(b,['details','selectedFlight'])||getPath(b,['details','selectedResult'])||{};let segments=arr(selected.segments);if(!segments.length)segments=deepArray(selected,['segments','sI']);if(!segments.length)segments=deepArray(b,['segments','sI']);const first=segments[0]||selected||{};const last=segments[segments.length-1]||first;const firstRaw=first.raw||first;const lastRaw=last.raw||last;const fd=firstRaw.fD||first.fD||{};const ai=fd.aI||{};const depAirport=firstRaw.da||first.da||{};const arrAirport=lastRaw.aa||last.aa||{};const code=firstValue(first.airlineCode,selected.airlineCode,ai.code,deepFind(first,['airlineCode']));const name=firstValue(first.airline,selected.airline,ai.name,deepFind(first,['airlineName']),'Airline');const number=firstValue(first.flightNo,selected.flightNo,[code,fd.fN].filter(Boolean).join(' '));const dep=firstValue(first.dep,first.departureTime,selected.departureTime,firstRaw.dt,deepFind(first,['departureTime','departureDateTime']));const arrival=firstValue(last.arr,last.arrivalTime,selected.arrivalTime,lastRaw.at,deepFind(last,['arrivalTime','arrivalDateTime']));const fromCode=firstValue(first.origin,selected.origin,depAirport.code,deepFind(first,['originCode']));const toCode=firstValue(last.destination,selected.destination,arrAirport.code,deepFind(last,['destinationCode']));const fromCity=firstValue(depAirport.city,depAirport.cityCode,first.originCity,selected.originCity,fromCode);const toCity=firstValue(arrAirport.city,arrAirport.cityCode,last.destinationCity,selected.destinationCity,toCode);const fromAirport=firstValue(depAirport.name,first.originName,selected.originName);const toAirport=firstValue(arrAirport.name,last.destinationName,selected.destinationName);const mins=Number(selected.durationMinutes||selected.duration||segments.reduce((sum,s)=>sum+Number(s.duration||0)+Number(s.layover||s.cT||0),0));const stops=Math.max(0,Number(selected.stops!==undefined?selected.stops:segments.length-1)||0);return {selected,segments,code,name,number,dep,arrival,fromCode,toCode,fromCity,toCity,fromAirport,toAirport,fromTerminal:firstValue(depAirport.terminal,first.departureTerminal),toTerminal:firstValue(arrAirport.terminal,last.arrivalTerminal),duration:duration(mins),stops};}
  function hotelImgUrl(v){if(!v)return '';if(typeof v==='string'){const s=text(v);return /^https?:\/\//i.test(s)?s:(/^\/\//.test(s)?'https:'+s:'');}const links=v.links||{};return hotelImgUrl((links.Standard&&(links.Standard.href||links.Standard.url))||(links.XXL&&(links.XXL.href||links.XXL.url))||v.url||v.src||v.imageUrl||v.href||'');}
  function hotelData(b){
    const selected=b.selectedHotel||b.selectedResult||getPath(b,['details','selectedHotel'])||getPath(b,['details','selectedResult'])||{};
    const hInfo=getPath(selected,['raw','hInfo'])||getPath(selected,['hInfo'])||getPath(b,['reviewRaw','hInfo'])||getPath(b,['supplierBooking','details','itemInfos','HOTEL','hInfo'])||{};
    const search=getPath(b,['details','searchPayload'])||b.search||{};
    const images=[selected.image,selected.imageUrl,selected.thumbnail,selected.heroImage,hInfo.image,hInfo.imageUrl]
      .concat(Array.isArray(selected.images)?selected.images:[]).concat(Array.isArray(hInfo.imgs)?hInfo.imgs:[]).concat(Array.isArray(hInfo.img)?hInfo.img:[])
      .map(hotelImgUrl).filter(Boolean);
    const checkIn=firstValue(b.checkIn,search.checkIn,search.checkinDate,getPath(b,['details','checkIn']),deepFind(b,['checkIn','checkInDate']));
    const checkOut=firstValue(b.checkOut,search.checkOut,search.checkoutDate,getPath(b,['details','checkOut']),deepFind(b,['checkOut','checkOutDate']));
    const guests=deepArray(b,['guests','travellers','passengers','travellerInfos']);
    const guestFromDetails=arr(getPath(b,['details','guests']));
    const guestList=guests.length?guests:(guestFromDetails.length?guestFromDetails:[]);
    const lead=guestList[0]||{};
    const leadName=[lead.ti||lead.title,lead.fN||lead.firstName,lead.lN||lead.lastName].filter(Boolean).join(' ')||firstValue(lead.name,lead.fullName,'');
    const adults=Number(firstValue(lead.adt,search.adults,deepFind(b,['adults','adultCount'])))||guestList.filter(g=>/ADT|ADULT/i.test(String(g.pt||g.type||'ADT'))).length||Math.max(1,guestList.length||0);
    const children=Number(firstValue(search.children,deepFind(b,['children','childCount'])))||guestList.filter(g=>/CHD|CHILD/i.test(String(g.pt||g.type||''))).length||0;
    const rooms=Math.max(1,Number(firstValue(search.rooms,search.roomCount,selected.roomCount,deepFind(b,['rooms','roomCount'])))||arr(getPath(hInfo,['ops'])).length||1);
    const address=firstValue(
      selected.address,
      [getPath(hInfo,['ad','adr']),getPath(hInfo,['ad','ctn']),getPath(hInfo,['ad','cn'])].filter(Boolean).join(', '),
      selected.city,selected.area,getPath(hInfo,['ad','ctn'])
    );
    return {
      name:firstValue(selected.name,selected.hotelName,hInfo.name,b.hotelName,deepFind(b,['hotelName']))||'Hotel booking',
      city:firstValue(selected.city,selected.area,getPath(hInfo,['ad','ctn']),b.city,search.cityName,search.city,deepFind(b,['hotelCity','destination'])),
      address:address,
      checkIn,checkOut,
      nights:nightsBetween(checkIn,checkOut)||Number(search.nights)||0,
      rooms,adults,children,leadName,
      image:images[0]||'',
      confirmation:hotelConfirmationRef(b)
    };
  }
  function passengerCount(b){const list=deepArray(b,['travellers','passengers','guests','travellerInfos']);if(list.length)return list.length;const adults=Number(deepFind(b,['adults','adultCount']))||0;const children=Number(deepFind(b,['children','childCount']))||0;const infants=Number(deepFind(b,['infants','infantCount']))||0;return Math.max(1,adults+children+infants);}
  function amountOf(b){return Number(getPath(b,['price','customerPayable'])||getPath(b,['price','finalPayableAmount'])||b.totalAmount||b.amount||getPath(b,['price','finalTotal'])||getPath(b,['fare','finalTotal'])||getPath(b,['quote','publicPrice','finalTotal'])||deepFind(b,['customerPayable','finalTotal','totalAmount','totalFare']))||0;}
  function currencyOf(b){return firstValue(b.currency,getPath(b,['price','currency']),getPath(b,['quote','publicPrice','currency']))||'INR';}
  function bookingDate(b,serviceData){return serviceData.dep||serviceData.checkIn||b.createdAt||b.updatedAt||'';}
  function tripType(b){return firstValue(deepFind(b,['tripType','journeyType']),'One way');}
  function airlineLogo(code,name){const safeCode=text(code).toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,3);if(!safeCode)return esc(text(name).slice(0,2).toUpperCase()||'TY');return '<img src="/assets/airline-logo/'+attr(safeCode)+'.png" alt="" onerror="this.parentNode.textContent=\''+attr(safeCode)+'\'">';}
  function detailUrl(id,service,extra){const page=service==='hotel'?'/pages/results/hotels.html':'/pages/results/flights.html';const q=new URLSearchParams({service:service,step:'booking-status',bookingId:id});if(extra)Object.keys(extra).forEach(k=>{if(extra[k])q.set(k,extra[k]);});return page+'?'+q.toString();}
  function supportUrl(id){return '/customer-support.html?bookingId='+encodeURIComponent(id);}
  function hotelLooksNonRefundable(b){
    const joined=[deepFind(b,['refundable','cancellationPolicy','nonRefundable','policyText']),getPath(b,['reviewRaw','hInfo','ops',0,'ris',0,'cnp','inra'])].filter(v=>v!==undefined&&v!==null).join(' ');
    return /non-?refundable/i.test(joined) || joined===true || joined==='true';
  }
  function hotelHasRefundSignal(b){
    if(hotelLooksNonRefundable(b)) return false;
    return !!(firstValue(b.refundAmount,b.refundStatus,b.refundDate,getPath(b,['payment','refundAmount']),getPath(b,['payment','refundStatus'])) || paymentPaid(b));
  }
  function hotelActionsHtml(b,kind,id){
    return '<div class="card-actions"><a class="manage" data-manage href="'+attr(detailUrl(id,'hotel'))+'">Manage booking</a></div>';
  }

  function card(b){
    const service=text(b.service||b.type||activeService).toLowerCase();
    const id=travelYaraaBookingId(b);
    const kind=statusKind(b);
    const displayKind=(activeStatus==='completed'&&(kind==='confirmed'||kind==='completed'))?'completed':kind;
    const count=passengerCount(b);
    const total=money(amountOf(b),currencyOf(b));
    let summary='';let title='';let date='';let actions='';
    if(service==='flight'){
      const f=flightData(b);
      title=[f.fromCity+(f.fromCode&&f.fromCity!==f.fromCode?' ('+f.fromCode+')':''),f.toCity+(f.toCode&&f.toCity!==f.toCode?' ('+f.toCode+')':'')].filter(Boolean).join(' → ')||'Flight booking';
      date=formatDate(bookingDate(b,f));
      summary='<div class="flight-summary"><div class="airline"><div class="airline-logo">'+airlineLogo(f.code,f.name)+'</div><div><b>'+esc(f.name)+'</b><span>'+esc([f.number,f.stops?f.stops+' stop'+(f.stops>1?'s':''):'Non-stop',f.duration].filter(Boolean).join(' • '))+'</span></div></div><div class="flight-route"><div class="point"><strong>'+esc(formatTime(f.dep))+'</strong><b>'+esc([f.fromCity,f.fromCode&&'('+f.fromCode+')'].filter(Boolean).join(' '))+'</b><small>'+esc([f.fromAirport,f.fromTerminal].filter(Boolean).join(' • '))+'</small></div><div class="journey"><div class="journey-line"><i>✈</i></div><span>'+esc(f.duration)+'</span></div><div class="point right"><strong>'+esc(formatTime(f.arrival))+'</strong><b>'+esc([f.toCity,f.toCode&&'('+f.toCode+')'].filter(Boolean).join(' '))+'</b><small>'+esc([f.toAirport,f.toTerminal].filter(Boolean).join(' • '))+'</small></div></div></div>';
      actions='<a class="manage" data-manage href="'+attr(detailUrl(id,service))+'">Manage booking</a>';
    }else if(service==='hotel'){
      const h=hotelData(b);
      title=h.name;
      date='';
      const compact=[
        h.nights?(h.nights+' night'+(Number(h.nights)===1?'':'s')):'',
        h.rooms?(h.rooms+' room'+(Number(h.rooms)===1?'':'s')):'',
        h.adults?(h.adults+' adult'+(Number(h.adults)===1?'':'s')):'',
        h.children?(h.children+' child'+(Number(h.children)===1?'':'ren')):''
      ].filter(Boolean).join(' · ');
      summary='<div class="hotel-summary">'+(h.image?'<div class="hotel-thumb"><img src="'+attr(h.image)+'" alt="" loading="lazy" onerror="this.parentNode.classList.add(\'fallback\');this.remove()"></div>':'<div class="hotel-thumb fallback" aria-hidden="true"></div>')
        +'<div class="hotel-copy">'
        +'<span>'+esc(h.city||h.address||'')+'</span>'
        +'<span class="hotel-dates">'+esc([formatDate(h.checkIn)?'In '+formatDate(h.checkIn):'', formatDate(h.checkOut)?'Out '+formatDate(h.checkOut):''].filter(Boolean).join(' · ')||'Dates pending')+'</span>'
        +(compact?'<span class="hotel-inline">'+esc(compact)+'</span>':'')
        +'</div></div>';
      actions=hotelActionsHtml(b,displayKind,id);
    }else{
      title=service.charAt(0).toUpperCase()+service.slice(1)+' booking';
      date=formatDate(b.createdAt||b.updatedAt);
      summary='<div class="hotel-summary plain"><b>'+esc(title)+'</b><span>Booking details are available in Manage Booking.</span></div>';
      actions='<a class="manage" data-manage href="'+attr(detailUrl(id,service))+'">Manage booking</a>';
    }
    return '<article class="booking-card"><div class="status-strip '+attr(displayKind)+'"><span>'+esc(statusLabel(displayKind,service))+'</span><span>'+esc(service.charAt(0).toUpperCase()+service.slice(1))+'</span></div><div class="card-body"><div class="card-head"><div><h2 class="route">'+esc(title)+'</h2>'+(date?'<p class="meta">'+esc([date,service==='hotel'?'':(count+' passenger'+(count>1?'s':'')),service==='flight'?tripType(b):''].filter(Boolean).join(' • '))+'</p>':'')+'<p class="booking-id">Booking ID: <b>'+esc(id)+'</b><button class="copy" type="button" data-copy="'+attr(id)+'" aria-label="Copy booking ID"></button></p></div><span class="status-badge '+attr(displayKind)+'">'+esc(statusLabel(displayKind,service))+'</span></div>'+summary+(total && service!=='hotel'?'<div class="price-row"><span>Total paid / payable</span><strong>'+esc(total)+'</strong></div>':'')+actions+'</div></article>';
  }
  function hCityTitle(b){const h=hotelData(b);return h.city||h.name;}

  async function downloadHotelFile(path){
    const auth=token();
    if(!auth){alert('Please log in to download this document.');return;}
    $('#opening').hidden=false;
    try{
      const response=await fetch(api(path),{headers:{Accept:'application/pdf',Authorization:'Bearer '+auth},cache:'no-store'});
      if(!response.ok){const data=await response.json().catch(()=>({}));throw new Error(data.message||data.error||'Document is not available.');}
      const blob=await response.blob();
      const disposition=response.headers.get('content-disposition')||'';
      const match=disposition.match(/filename="?([^";]+)"?/i);
      const name=match&&match[1]?match[1]:'TravelYaraa-document.pdf';
      const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200);
    }catch(error){alert(error.message||'Document could not be downloaded.');}
    finally{$('#opening').hidden=true;}
  }
  async function cancelHotelBooking(id){
    if(!confirm('Check the hotel cancellation charges and continue with the cancellation request?'))return;
    $('#opening').hidden=false;
    try{
      const auth=token();
      const quoteRes=await fetch(api('/api/bookings/'+encodeURIComponent(id)+'/cancel'),{method:'POST',headers:{Accept:'application/json','Content-Type':'application/json',Authorization:'Bearer '+auth},body:JSON.stringify({confirm:false,service:'hotel',reason:'Customer requested hotel cancellation from My Bookings'})});
      const quote=await quoteRes.json().catch(()=>({}));
      if(!quoteRes.ok||quote.success===false)throw new Error(quote.message||quote.error||'Cancellation could not be checked.');
      if(!confirm((quote.message||'Cancellation charges were checked.')+' Submit the cancellation request now?'))return;
      const confRes=await fetch(api('/api/bookings/'+encodeURIComponent(id)+'/cancel'),{method:'POST',headers:{Accept:'application/json','Content-Type':'application/json',Authorization:'Bearer '+auth},body:JSON.stringify({confirm:true,service:'hotel',reason:'Customer confirmed hotel cancellation from My Bookings'})});
      const conf=await confRes.json().catch(()=>({}));
      if(!confRes.ok||conf.success===false)throw new Error(conf.message||conf.error||'Cancellation could not be submitted.');
      alert(conf.message||'Cancellation request submitted.');
      load();
    }catch(error){alert(error.message||'Cancellation failed.');}
    finally{$('#opening').hidden=true;}
  }

  function setActive(){$$('.service-tab').forEach(b=>b.classList.toggle('active',b.dataset.service===activeService));$$('.status-tab').forEach(b=>b.classList.toggle('active',b.dataset.status===activeStatus));}
  function loading(){return '<div class="state"><div class="loader" aria-label="Loading bookings"></div></div>';}
  function loginState(){return '<div class="state"><div><h2>Please log in</h2><p>Log in with the same TravelYaraa account used for the booking.</p><a data-login href="/index.html?openLogin=1&amp;redirect=%2Fmy-bookings.html">Go to login</a></div></div>';}
  function emptyState(){return '<div class="state"><div><h2>No bookings found</h2><p>There are no '+esc(activeStatus)+' '+esc(activeService)+' bookings in this account.</p><a href="/index.html">Book a new trip</a></div></div>';}
  function errorState(message){return '<div class="state"><div><h2>Bookings could not be loaded</h2><p>'+esc(message||'Please check your connection and try again.')+'</p><button class="retry" type="button" id="retry">Try again</button></div></div>';}
  async function load(){
    setActive();
    const content=$('#content');
    content.innerHTML=loading();
    try{
      const auth=await ensureToken();
      if(!auth){content.innerHTML=loginState();return;}
      const query=new URLSearchParams({service:activeService,status:activeStatus});
      let data;
      try{
        data=await request('/api/bookings/my?'+query.toString());
      }catch(error){
        if(error.status!==401)throw error;
        clearStoredToken();
        const refreshed=firebaseUser?await syncFirebaseUser(firebaseUser):'';
        if(!refreshed){content.innerHTML=loginState();return;}
        data=await request('/api/bookings/my?'+query.toString());
      }
      const rows=rowsFrom(data);
      content.innerHTML=rows.length?'<div class="list">'+rows.map(card).join('')+'</div>':emptyState();
    }catch(error){
      if(error.status===401&&!firebaseUser){content.innerHTML=loginState();return;}
      content.innerHTML=errorState(error.message);
      const retry=$('#retry');
      if(retry)retry.onclick=load;
    }
  }

  $('#backButton').onclick=()=>{if(history.length>1)history.back();else location.href='/index.html';};
  $$('.service-tab').forEach(button=>button.onclick=()=>{activeService=button.dataset.service;load();});
  $$('.status-tab').forEach(button=>button.onclick=()=>{activeStatus=button.dataset.status;load();});
  document.addEventListener('click',async event=>{
    const login=event.target.closest('[data-login]');
    if(login){
      event.preventDefault();
      rememberLoginRedirect();
      location.href=login.href;
      return;
    }
    const copy=event.target.closest('[data-copy]');
    if(copy){event.preventDefault();const value=copy.dataset.copy||'';try{await navigator.clipboard.writeText(value);copy.classList.add('copied');setTimeout(()=>copy.classList.remove('copied'),900);}catch(_){const input=document.createElement('textarea');input.value=value;document.body.appendChild(input);input.select();document.execCommand('copy');input.remove();}return;}
    const download=event.target.closest('[data-hotel-download]');
    if(download){event.preventDefault();downloadHotelFile(download.getAttribute('data-hotel-download'));return;}
    const cancelBtn=event.target.closest('[data-hotel-cancel]');
    if(cancelBtn){event.preventDefault();cancelHotelBooking(cancelBtn.getAttribute('data-hotel-cancel'));return;}
    const manage=event.target.closest('[data-manage]');
    if(manage){$('#opening').hidden=false;}
  });
  /* assets/js/firebase-auth.js is the only Firebase implementation on this
     page; it passes a user only after the backend authToken exists. */
  window.tyApplyAuthUser=function(user,state){
    firebaseResolved=true;
    firebaseUser=user||null;
    if(resolveFirebaseReady){resolveFirebaseReady(firebaseUser);resolveFirebaseReady=null;}
    const failure=state&&state.error;
    if(failure){
      clearStoredToken();
      $('#content').innerHTML=errorState(failure.message||'TravelYaraa login could not be completed.');
      const retry=$('#retry');
      if(retry)retry.onclick=load;
      return;
    }
    if(firebaseUser){
      syncFirebaseUser(firebaseUser).then(load).catch(error=>{
        clearStoredToken();
        $('#content').innerHTML=errorState(error&&error.message);
        const retry=$('#retry');
        if(retry)retry.onclick=load;
      });
    }else{
      clearStoredToken();
      load();
    }
  };
  load();
})();
</script>
